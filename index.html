<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korgi Kode</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #4f46e5 0%, transparent 35%),
                radial-gradient(circle at bottom right, #0ea5e9 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #111827);
            color: white;
            text-align: center;
            padding: 24px;
        }

        .card {
            max-width: 760px;
            width: 100%;
            padding: 64px 40px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(52px, 9vw, 92px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .tagline {
            margin-top: 22px;
            font-size: 22px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.82);
        }

        .coming-soon {
            margin-top: 34px;
            font-size: 18px;
            font-weight: 600;
        }

        .dots {
            margin-top: 24px;
            font-size: 28px;
            letter-spacing: 12px;
            opacity: 0.75;
        }

        footer {
            margin-top: 42px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="badge">Independent App Studio</div>

        <h1>Korgi Kode</h1>

        <p class="tagline">
            Thoughtful apps designed to make everyday tasks a little easier.
        </p>

        <div class="coming-soon">
            New site and app showcase coming soon.
        </div>

        <div class="dots">• • •</div>

        <footer>
            korgikode.com
        </footer>
    </main>
</body>
</html>
